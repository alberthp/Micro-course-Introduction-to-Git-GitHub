<svg width="100%" viewBox="0 0 680 160" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Local and remote repository diagram</title>
<desc>Two boxes showing the local repository on your computer and the remote repository on GitHub servers, connected by a bidirectional sync arrow.</desc>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#2C2C2A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Local repository box -->
<rect x="40" y="30" width="230" height="100" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="155" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="500" fill="#04342C">Local repository</text>
<text x="155" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">(your computer)</text>
<text x="155" y="108" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">You edit here</text>

<!-- Remote repository box -->
<rect x="410" y="30" width="230" height="100" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="525" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="500" fill="#26215C">Remote repository</text>
<text x="525" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">(GitHub servers)</text>
<text x="525" y="108" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">Backup + sharing</text>

<!-- Bidirectional arrow -->
<line x1="272" y1="80" x2="408" y2="80" stroke="#2C2C2A" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

<!-- Sync label -->
<rect x="312" y="56" width="56" height="20" rx="4" fill="#FAEEDA"/>
<text x="340" y="68" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="500" fill="#854F0B">sync</text>

</svg>
