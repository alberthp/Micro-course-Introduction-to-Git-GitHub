<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Merge conflict diagram</title>
<desc>Two branches from the same main commit each change the same h1 line. When User_2 tries to merge, Git reports a conflict.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#2C2C2A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<line x1="80" y1="60" x2="600" y2="60" stroke="#5F5E5A" stroke-width="2"/>
<rect x="40" y="42" width="56" height="24" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="68" y="56" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="12" fill="#2C2C2A">main</text>
<circle cx="200" cy="60" r="14" fill="white" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="200" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">C</text>
<text x="200" y="36" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Hello World!</text>
<path d="M214 54 Q260 20 310 20" fill="none" stroke="#0F6E56" stroke-width="1.5"/>
<line x1="310" y1="20" x2="420" y2="20" stroke="#0F6E56" stroke-width="1.5"/>
<rect x="310" y="4" width="110" height="32" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="365" y="22" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">User_1's edit</text>
<text x="460" y="24" dominant-baseline="central" font-family="sans-serif" font-size="12" font-style="italic" fill="#5F5E5A">"Welcome!"</text>
<path d="M420 20 Q470 20 490 60" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="500" cy="60" r="14" fill="white" stroke="#0F6E56" stroke-width="1.5"/>
<text x="500" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">D</text>
<path d="M214 66 Q260 120 310 120" fill="none" stroke="#993C1D" stroke-width="1.5"/>
<line x1="310" y1="120" x2="420" y2="120" stroke="#993C1D" stroke-width="1.5"/>
<rect x="310" y="104" width="110" height="32" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="365" y="122" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">User_2's edit</text>
<text x="460" y="124" dominant-baseline="central" font-family="sans-serif" font-size="12" font-style="italic" fill="#5F5E5A">"Git Demo"</text>
<path d="M420 120 Q470 120 490 66" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<rect x="530" y="42" width="80" height="36" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="570" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#791F1F">Conflict!</text>
<rect x="80" y="176" width="520" height="100" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="198" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Both changed the same line</text>
<text x="120" y="224" dominant-baseline="central" font-family="monospace" font-size="12" fill="#5F5E5A">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text>
<text x="120" y="242" dominant-baseline="central" font-family="monospace" font-size="12" fill="#0F6E56">  Welcome!</text>
<text x="120" y="258" dominant-baseline="central" font-family="monospace" font-size="12" fill="#5F5E5A">=======</text>
<text x="370" y="224" dominant-baseline="central" font-family="monospace" font-size="12" fill="#5F5E5A">&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature/title-b</text>
<text x="370" y="242" dominant-baseline="central" font-family="monospace" font-size="12" fill="#A32D2D">  Git Demo</text>
<text x="370" y="258" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">→ You decide which to keep</text>
</svg>
