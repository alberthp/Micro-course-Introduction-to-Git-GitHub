<svg width="100%" viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Branch and merge diagram</title>
<desc>Main branch with commits A, B, C, D. A feature branch diverges at C with commits E, F, G, then merges back into D.</desc>

<!-- Main branch line -->
<line x1="100" y1="60" x2="600" y2="60" stroke="#5F5E5A" stroke-width="2"/>

<!-- Branch label: main -->
<rect x="40" y="42" width="56" height="24" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="68" y="56" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="12" fill="#2C2C2A">main</text>

<!-- Commit A -->
<circle cx="160" cy="60" r="14" fill="white" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="160" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">A</text>

<!-- Commit B -->
<circle cx="260" cy="60" r="14" fill="white" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="260" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">B</text>

<!-- Commit C -->
<circle cx="340" cy="60" r="14" fill="white" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">C</text>

<!-- Commit D (merge) -->
<circle cx="560" cy="60" r="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text x="560" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">D</text>
<text x="560" y="36" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">merge</text>

<!-- Feature branch curves: C down to E, G up to D -->
<path d="M340 74 Q340 140 390 140" fill="none" stroke="#0F6E56" stroke-width="1.5"/>
<line x1="390" y1="140" x2="510" y2="140" stroke="#0F6E56" stroke-width="1.5"/>
<path d="M510 140 Q560 140 560 74" fill="none" stroke="#0F6E56" stroke-width="1.5"/>

<!-- Branch label: feature/menu -->
<rect x="40" y="128" width="110" height="24" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="95" y="142" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="12" fill="#04342C">feature/menu</text>
<line x1="150" y1="140" x2="376" y2="140" stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 3"/>

<!-- Commit E -->
<circle cx="390" cy="140" r="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text x="390" y="142" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">E</text>

<!-- Commit F -->
<circle cx="450" cy="140" r="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text x="450" y="142" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">F</text>

<!-- Commit G -->
<circle cx="510" cy="140" r="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text x="510" y="142" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">G</text>

<!-- Subtitle -->
<text x="450" y="178" text-anchor="middle" font-family="sans-serif" font-size="12" font-style="italic" fill="#888780">work safely here, then merge back</text>

</svg>
