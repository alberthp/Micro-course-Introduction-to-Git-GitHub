<svg width="100%" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Git pipeline diagram</title>
<desc>Four-stage pipeline: Working directory, Staging area, Local repository, Remote (GitHub), connected by arrows. A return arrow below shows git pull.</desc>
<defs>
<marker id="fwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M1 1L8 5L1 9" fill="none" stroke="#2C2C2A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="pull" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M1 1L8 5L1 9" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="20" y="60" width="136" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="88" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">Working directory</text>
<text x="88" y="100" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#5F5E5A">You edit files here</text>
<rect x="198" y="60" width="126" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="261" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#412402">Staging area</text>
<text x="261" y="100" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#854F0B">Select what to save</text>
<rect x="366" y="60" width="136" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="434" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#04342C">Local repository</text>
<text x="434" y="100" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0F6E56">Snapshot on your PC</text>
<rect x="544" y="60" width="116" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="602" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#26215C">Remote (GitHub)</text>
<text x="602" y="100" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#534AB7">Shared with everyone</text>
<line x1="156" y1="88" x2="196" y2="88" stroke="#2C2C2A" stroke-width="2" marker-end="url(#fwd)"/>
<line x1="324" y1="88" x2="364" y2="88" stroke="#2C2C2A" stroke-width="2" marker-end="url(#fwd)"/>
<line x1="502" y1="88" x2="542" y2="88" stroke="#2C2C2A" stroke-width="2" marker-end="url(#fwd)"/>
<rect x="148" y="36" width="60" height="22" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="178" y="49" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="11" fill="#185FA5">git add</text>
<rect x="308" y="36" width="80" height="22" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="348" y="49" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="11" fill="#185FA5">git commit</text>
<rect x="492" y="36" width="68" height="22" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="526" y="49" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="11" fill="#185FA5">git push</text>
<path d="M602 116 L602 160 L88 160 L88 116" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#pull)"/>
<rect x="312" y="148" width="60" height="22" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="342" y="161" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="11" fill="#854F0B">git pull</text>
<line x1="20" y1="200" x2="502" y2="200" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="260" y="218" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888780">Your computer</text>
<text x="602" y="218" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888780">Cloud</text>
<text x="88" y="244" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#888780">git status → check the state at any point</text>
<text x="434" y="244" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#888780">git diff → see what changed</text>
</svg>
