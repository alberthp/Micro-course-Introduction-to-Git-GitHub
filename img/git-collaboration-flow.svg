<svg width="100%" viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Collaboration flow: push and pull</title>
<desc>User_1 pushes changes to GitHub, then User_2 pulls those changes to their local copy.</desc>

<defs>
<marker id="push-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M1 1L8 5L1 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="pull-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M1 1L8 5L1 9" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- User_1 box -->
<rect x="40" y="40" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="115" y="60" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">User_1</text>
<text x="115" y="78" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">local repository</text>

<!-- GitHub box -->
<rect x="265" y="40" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="60" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">GitHub</text>
<text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">remote repository</text>

<!-- User_2 box -->
<rect x="490" y="40" width="150" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="565" y="60" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">User_2</text>
<text x="565" y="78" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">local repository</text>

<!-- Step 1 circle -->
<circle cx="60" cy="120" r="14" fill="white" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="60" y="122" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">1</text>

<!-- Step 1: git push -->
<rect x="88" y="108" width="100" height="24" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="138" y="122" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="12" fill="#04342C">git push</text>
<line x1="190" y1="120" x2="263" y2="120" stroke="#0F6E56" stroke-width="2" marker-end="url(#push-arrow)"/>

<!-- Step 2: git pull -->
<line x1="417" y1="120" x2="488" y2="120" stroke="#993C1D" stroke-width="2" marker-end="url(#pull-arrow)"/>
<rect x="492" y="108" width="86" height="24" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="535" y="122" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="12" fill="#4A1B0C">git pull</text>

<!-- Step 2 circle -->
<circle cx="620" cy="120" r="14" fill="white" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="620" y="122" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">2</text>

<!-- Labels -->
<text x="225" y="160" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">User_1 edits and pushes</text>
<text x="455" y="160" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">User_2 downloads the changes</text>

<text x="340" y="188" text-anchor="middle" font-family="sans-serif" font-size="12" font-style="italic" fill="#888780">Both users now have the same version</text>

</svg>
