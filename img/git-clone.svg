<svg width="100%" viewBox="0 0 680 180" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Git clone diagram</title>
<desc>A remote repository on GitHub is copied to the local computer via git clone.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#2C2C2A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="40" y="40" width="220" height="100" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="150" y="68" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="500" fill="#26215C">Remote repository</text>
<text x="150" y="88" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">(GitHub)</text>
<text x="150" y="118" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">README.md, .git history</text>
<line x1="262" y1="90" x2="418" y2="90" stroke="#185FA5" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="305" y="56" width="72" height="22" rx="4" fill="#E6F1FB"/>
<text x="341" y="69" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="12" fill="#185FA5">git clone</text>
<rect x="420" y="40" width="220" height="100" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="530" y="68" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="500" fill="#04342C">Local copy</text>
<text x="530" y="88" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">(your computer)</text>
<text x="530" y="118" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">README.md, .git history</text>
<text x="340" y="168" text-anchor="middle" font-family="sans-serif" font-size="12" font-style="italic" fill="#888780">full copy: code + complete history</text>
</svg>
