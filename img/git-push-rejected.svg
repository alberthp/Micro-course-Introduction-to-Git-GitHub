<svg width="100%" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Push rejected: horizontal timeline</title>
<desc>Both users pull main, both edit code, User_1 pushes OK, User_2 push is rejected because remote moved forward.</desc>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M1 1L8 5L1 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M1 1L8 5L1 9" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<line x1="40" y1="130" x2="640" y2="130" stroke="#5F5E5A" stroke-width="1"/>
<text x="650" y="134" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#888780">time →</text>
<rect x="50" y="108" width="100" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="100" y="124" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">git pull</text>
<text x="100" y="140" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">both users</text>
<rect x="175" y="108" width="100" height="44" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="225" y="124" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">Edit code</text>
<text x="225" y="140" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#854F0B">both users</text>
<rect x="310" y="56" width="120" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="370" y="72" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">User_1: push</text>
<text x="370" y="88" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">✓ accepted</text>
<line x1="275" y1="118" x2="308" y2="85" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#ok)"/>
<rect x="455" y="56" width="100" height="44" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="505" y="72" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">GitHub</text>
<text x="505" y="88" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">updated ✓</text>
<line x1="430" y1="78" x2="453" y2="78" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#ok)"/>
<rect x="455" y="158" width="120" height="44" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="515" y="174" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#791F1F">User_2: push</text>
<text x="515" y="190" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#A32D2D">✗ rejected!</text>
<line x1="275" y1="142" x2="453" y2="172" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#fail)"/>
<text x="100" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888780">Same starting</text>
<text x="100" y="186" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888780">point</text>
<text x="225" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888780">Same file,</text>
<text x="225" y="186" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888780">different edits</text>
<rect x="80" y="220" width="520" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="236" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">User_2's local main is behind GitHub</text>
<text x="340" y="252" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">GitHub rejects the push because it already has newer commits from User_1</text>
</svg>
