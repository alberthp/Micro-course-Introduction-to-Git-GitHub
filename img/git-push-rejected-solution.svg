<svg width="100%" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" role="img">
<title>User_2 solution: pull then push</title>
<desc>User_2 pulls from GitHub to sync, resolves if needed, then pushes successfully.</desc>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M1 1L8 5L1 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="pull-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M1 1L8 5L1 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="user2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M1 1L8 5L1 9" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="conflict" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M1 1L8 5L1 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="340" y="24" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#5F5E5A">User_2's solution</text>
<rect x="40" y="50" width="110" height="44" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="95" y="66" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">GitHub</text>
<text x="95" y="82" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">has User_1's code</text>
<line x1="152" y1="72" x2="198" y2="72" stroke="#bbbaca" stroke-width="2" marker-end="url(#user2)"/>
<rect x="200" y="50" width="110" height="44" rx="6" fill="#FAEEDA" stroke="#bbbaca" stroke-width="0.5"/>
<text x="255" y="66" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">git pull</text>
<text x="255" y="82" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#854F0B">User_2 syncs</text>
<line x1="312" y1="72" x2="348" y2="72" stroke="#bbbaca" stroke-width="2" marker-end="url(#conflict)"/>
<rect x="350" y="50" width="120" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="410" y="66" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Resolve</text>
<text x="410" y="82" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">if conflicts exist</text>
<line x1="472" y1="72" x2="508" y2="72" stroke="#bbbaca" stroke-width="2" marker-end="url(#conflict)"/>
<rect x="510" y="50" width="120" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="570" y="66" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">git push</text>
<text x="570" y="82" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">✓ accepted now</text>
<line x1="40" y1="118" x2="640" y2="118" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="95" y="136" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888780">REMOTE</text>
<text x="340" y="136" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888780">LOCAL (User_2's computer)</text>
<text x="570" y="136" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888780">REMOTE</text>
<rect x="80" y="158" width="520" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="174" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="12" fill="#5F5E5A">git pull → resolve conflicts → git add . → git commit → git push</text>
<text x="340" y="192" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Now both users' changes are on GitHub</text>
</svg>