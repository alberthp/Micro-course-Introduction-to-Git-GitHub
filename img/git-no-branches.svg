<path d="M2 1L8 5L2 9" fill="none" stroke="#2C2C2A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<line x1="80" y1="70" x2="520" y2="70" stroke="#5F5E5A" stroke-width="2"/>
