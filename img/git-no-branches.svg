<circle cx="400" cy="70" r="14" fill="white" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="400" y="72" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">C</text>
<rect x="490" y="50" width="40" height="40" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="510" y="72" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#791F1F">???</text>
<line x1="400" y1="84" x2="260" y2="140" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/>
